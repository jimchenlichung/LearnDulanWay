<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LinguaFlow">
  <title>LinguaFlow AI - 沉浸式英語學習與複習 App</title>
  <!-- 動態注入 PWA Manifest 讓手機 GitHub Pages 可安裝為 100% 無網址列全螢幕 App -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"LinguaFlow AI 英語學習","short_name":"LinguaFlow","start_url":".","display":"standalone","background_color":"#020617","theme_color":"#4f46e5","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3898/3898082.png","sizes":"512x512","type":"image/png"}]}' />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #020617; color: #f1f5f9; -webkit-tap-highlight-color: transparent; user-select: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden flex flex-col bg-slate-950 font-sans">

  <!-- 頂部導覽列 -->
  <header id="appHeader" class="flex-none bg-slate-900/95 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between z-20">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-white shadow">LF</div>
      <div>
        <h1 class="text-sm font-bold text-white leading-tight">LinguaFlow AI</h1>
        <p class="text-[10px] text-emerald-400">GitHub Pages 獨立全螢幕版</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="toggleFull()" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-bold shadow">📱 全螢幕</button>
      <button onclick="openAddModal()" class="px-2.5 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold shadow">＋ 新增</button>
      <button onclick="setApiKey()" class="p-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs" title="設定 Gemini API Key">⚙️</button>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="flex-1 overflow-y-auto p-4 max-w-xl mx-auto w-full relative">
    <!-- 頁籤 1: AI 對話 -->
    <section id="tab-chat" class="h-full flex flex-col justify-between">
      <div id="chatBox" class="flex-1 overflow-y-auto space-y-3 pb-4 pr-1"></div>
      <form onsubmit="sendChat(event)" class="flex gap-2 pt-2 border-t border-slate-800">
        <input id="chatInput" type="text" placeholder="用英文與 AI 對話 (點單字可收錄)..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500" />
        <button type="submit" class="px-4 py-2.5 bg-indigo-600 rounded-xl text-white font-bold text-sm">發送</button>
      </form>
    </section>

    <!-- 頁籤 2: 單字翻卡 -->
    <section id="tab-vocab" class="hidden h-full flex flex-col justify-between">
      <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
        <span id="vocabProgress">第 1 / 1 個</span>
        <span id="vocabStars" class="text-amber-400 font-bold"></span>
      </div>
      <div onclick="flipCard()" class="flex-1 min-h-[280px] bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700 rounded-3xl p-6 shadow-2xl flex flex-col justify-between cursor-pointer">
        <div class="flex justify-between items-center">
          <span id="vPos" class="px-2.5 py-0.5 rounded-full text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">n.</span>
          <button onclick="event.stopPropagation(); speakCurrentWord();" class="p-2 rounded-full bg-slate-700/60 text-white text-xs">🔊 發音</button>
        </div>
        <div class="my-auto text-center py-6">
          <h2 id="vWord" class="text-3xl font-extrabold text-white mb-2"></h2>
          <p id="vPhonetic" class="text-sm font-mono text-slate-400"></p>
          <div id="vBack" class="hidden mt-4 space-y-3 border-t border-slate-700/70 pt-4">
            <h3 id="vTrans" class="text-2xl font-bold text-emerald-400"></h3>
            <p id="vEx" class="text-xs text-slate-200 bg-slate-950/70 p-3 rounded-xl text-left leading-relaxed"></p>
          </div>
        </div>
        <p class="text-center text-[11px] text-indigo-400">點擊卡片翻面</p>
      </div>
      <div class="grid grid-cols-2 gap-2 mt-4">
        <button onclick="rateWord(-1)" class="py-3 rounded-2xl bg-rose-950/60 border border-rose-800/50 text-rose-300 font-bold text-xs">還不熟 (-1★)</button>
        <button onclick="rateWord(1)" class="py-3 rounded-2xl bg-emerald-950/60 border border-emerald-800/50 text-emerald-300 font-bold text-xs">記住了 (+1★)</button>
      </div>
    </section>

    <!-- 頁籤 3: 句子重組練習 -->
    <section id="tab-sentences" class="hidden h-full flex flex-col justify-between space-y-4">
      <div class="p-4 rounded-2xl bg-slate-800/90 border border-slate-700">
        <span id="sCount" class="text-xs text-indigo-400 font-bold">句子重組練習</span>
        <h3 id="sTrans" class="text-base font-bold text-white mt-1"></h3>
      </div>
      <div id="sSelected" class="min-h-[100px] p-4 rounded-2xl bg-slate-900 border-2 border-dashed border-slate-700 flex flex-wrap gap-2 items-center"></div>
      <div id="sPool" class="min-h-[90px] p-3 rounded-2xl bg-slate-800/50 border border-slate-700 flex flex-wrap gap-2"></div>
      <div class="flex gap-2">
        <button onclick="initScramble()" class="px-4 py-3 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">重排</button>
        <button onclick="checkScramble()" class="flex-1 py-3 rounded-xl bg-indigo-600 text-white font-bold text-sm shadow">檢查答案</button>
        <button onclick="nextSentence()" class="px-4 py-3 rounded-xl bg-emerald-600 text-white text-xs font-bold">下一題 →</button>
      </div>
    </section>
  </main>

  <!-- 底部選單 -->
  <nav class="flex-none bg-slate-900 border-t border-slate-800 px-2 py-2 flex justify-around z-20 pb-[max(0.5rem,env(safe-area-inset-bottom))]">
    <button onclick="switchTab('chat')" id="nav-chat" class="text-indigo-400 font-bold text-xs flex flex-col items-center">💬 AI 對話</button>
    <button onclick="switchTab('vocab')" id="nav-vocab" class="text-slate-400 text-xs flex flex-col items-center">🗂️ 單字翻卡</button>
    <button onclick="switchTab('sentences')" id="nav-sentences" class="text-slate-400 text-xs flex flex-col items-center">🧩 拼句練習</button>
  </nav>

  <!-- 快速新增單字/句子彈窗 -->
  <div id="addModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-3xl p-5 space-y-3">
      <h3 class="font-bold text-sm text-white">快速收錄單字或句子</h3>
      <input id="newWordInput" type="text" placeholder="輸入英文單字或完整句子" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white" />
      <input id="newTransInput" type="text" placeholder="輸入繁體中文翻譯" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white" />
      <input id="newExInput" type="text" placeholder="英文例句 (若收錄句子可不填)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white" />
      <div class="flex gap-2 pt-2">
        <button onclick="saveNewItem('vocab')" class="flex-1 py-2.5 bg-indigo-600 rounded-xl text-xs font-bold text-white">+ 存為單字</button>
        <button onclick="saveNewItem('sentence')" class="flex-1 py-2.5 bg-purple-600 rounded-xl text-xs font-bold text-white">+ 存為拼句</button>
        <button onclick="closeAddModal()" class="px-3 py-2.5 bg-slate-800 rounded-xl text-xs text-slate-300">取消</button>
      </div>
    </div>
  </div>

  <script>
    let vocabList = JSON.parse(localStorage.getItem('lf_vocab')) || [
  {
    "id": "v1",
    "word": "resilient",
    "phonetic": "/rɪˈzɪl.jənt/",
    "partOfSpeech": "adj.",
    "translation": "有韌性的；適應力強的",
    "example": "She is resilient and always recovers quickly from setbacks.",
    "exampleTranslation": "她很有韌性，總是能迅速從挫折中恢復過來。",
    "mastery": 2,
    "lastReviewed": "2026-11-04T01:55:54.777Z"
  },
  {
    "id": "v2",
    "word": "spontaneous",
    "phonetic": "/spɑːnˈteɪ.ni.əs/",
    "partOfSpeech": "adj.",
    "translation": "自發的；率性的；臨時起意的",
    "example": "We took a spontaneous road trip along the coast last weekend.",
    "exampleTranslation": "我們上週末臨時起意沿著海岸展開了一場公路旅行。",
    "mastery": 1,
    "lastReviewed": "2026-11-04T01:55:54.777Z"
  },
  {
    "id": "v3",
    "word": "articulate",
    "phonetic": "/ɑːrˈtɪk.jə.lət/",
    "partOfSpeech": "v. / adj.",
    "translation": "清楚表達；善於言辭的",
    "example": "He struggled to articulate his thoughts during the tense meeting.",
    "exampleTranslation": "在那場緊張的會議中，他極力想要清楚表達自己的想法。",
    "mastery": 3,
    "lastReviewed": "2026-11-04T01:55:54.777Z"
  }
];
    let sentenceList = JSON.parse(localStorage.getItem('lf_sentences')) || [
  {
    "id": "s1",
    "sentence": "Could you give me a rundown of the project timeline?",
    "translation": "你能簡要向我說明一下專案的時間表嗎？",
    "words": [
      "Could",
      "you",
      "give",
      "me",
      "a",
      "rundown",
      "of",
      "the",
      "project",
      "timeline?"
    ],
    "source": "職場工作溝通",
    "mastered": false
  },
  {
    "id": "s2",
    "sentence": "I would appreciate it if you could get back to me at your earliest convenience.",
    "translation": "如果您能在方便時儘早回覆我，我將不勝感激。",
    "words": [
      "I",
      "would",
      "appreciate",
      "it",
      "if",
      "you",
      "could",
      "get",
      "back",
      "to",
      "me",
      "at",
      "your",
      "earliest",
      "convenience."
    ],
    "source": "商務信件",
    "mastered": false
  },
  {
    "id": "s3",
    "sentence": "It slipped my mind completely that we had a meeting scheduled today.",
    "translation": "我完全忘記了我們今天有安排一場會議。",
    "words": [
      "It",
      "slipped",
      "my",
      "mind",
      "completely",
      "that",
      "we",
      "had",
      "a",
      "meeting",
      "scheduled",
      "today."
    ],
    "source": "日常生活口語",
    "mastered": true
  }
];
    let chatMessages = [
      { role: 'ai', text: "Welcome! Feel free to chat with me in English. Tap any word or phrase to save it!", trans: "歡迎！隨時用英文跟我聊天，點擊或輸入任何單字即可收錄練習！" }
    ];
    let vIdx = 0, vFlipped = false;
    let sIdx = 0, sPoolArr = [], sSelArr = [];

    function saveStorage() {
      localStorage.setItem('lf_vocab', JSON.stringify(vocabList));
      localStorage.setItem('lf_sentences', JSON.stringify(sentenceList));
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
    }

    function toggleFull() {
      const el = document.documentElement;
      if (!document.fullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen({ navigationUI: 'hide' }).catch(()=>{});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function switchTab(tab) {
      ['chat', 'vocab', 'sentences'].forEach(t => {
        document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab);
        document.getElementById('nav-' + t).className = t === tab ? 'text-indigo-400 font-bold text-xs flex flex-col items-center' : 'text-slate-400 text-xs flex flex-col items-center';
      });
      if (tab === 'vocab') renderVocab();
      if (tab === 'sentences') initScramble();
    }

    function renderChat() {
      const box = document.getElementById('chatBox');
      box.innerHTML = chatMessages.map((m, idx) => `
        <div class="flex flex-col ${m.role === 'user' ? 'items-end' : 'items-start'}">
          <div class="max-w-[85%] rounded-2xl p-3.5 ${m.role === 'user' ? 'bg-indigo-600 text-white' : 'bg-slate-800 border border-slate-700 text-slate-100'}">
            <div class="flex items-center justify-between gap-2">
              <p class="text-sm select-text">${m.text}</p>
              <button onclick="speak(\`${m.text.replace(/'/g, "\\'")}\`)" class="text-xs opacity-75 hover:opacity-100">🔊</button>
            </div>
            ${m.trans ? `<p class="text-xs text-slate-400 mt-1.5 border-t border-slate-700 pt-1">${m.trans}</p>` : ''}
            ${m.role === 'ai' ? `<button onclick="quickCollectSentence(${idx})" class="mt-2 text-[11px] text-indigo-300 underline block">+ 收錄整句到拼句練習</button>` : ''}
          </div>
        </div>
      `).join('');
      box.scrollTop = box.scrollHeight;
    }

    async function sendChat(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const txt = input.value.trim();
      if (!txt) return;
      chatMessages.push({ role: 'user', text: txt });
      input.value = '';
      renderChat();

      const key = localStorage.getItem('gemini_api_key') || '';
      if (key) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: `Reply naturally in 1-2 English sentences to: "${txt}". Also provide Traditional Chinese translation separated by |||. Format: English|||繁體中文` }] }]
            })
          });
          const data = await res.json();
          const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const [eng, zh] = raw.split('|||');
          chatMessages.push({ role: 'ai', text: (eng || raw).trim(), trans: (zh || '').trim() });
          renderChat();
          return;
        } catch (err) {}
      }
      setTimeout(() => {
        chatMessages.push({
          role: 'ai',
          text: "That's a great point! Could you tell me more about your experience with that?",
          trans: "這是一個很棒的觀點！你能多跟我分享一些你的相關經驗嗎？（點右上角⚙️可設定 API Key 啟用無限 AI 對答）"
        });
        renderChat();
      }, 500);
    }

    function setApiKey() {
      const cur = localStorage.getItem('gemini_api_key') || '';
      const k = prompt('請輸入您的 Google Gemini API Key (留空則使用內建模擬對話):', cur);
      if (k !== null) localStorage.setItem('gemini_api_key', k.trim());
    }

    function quickCollectSentence(idx) {
      const m = chatMessages[idx];
      if (!m) return;
      sentenceList.unshift({
        id: 's_' + Date.now(),
        sentence: m.text,
        translation: m.trans || 'AI 對話收錄句',
        words: m.text.split(' ')
      });
      saveStorage();
      alert('已加入拼句練習庫！');
    }

    function renderVocab() {
      if (!vocabList.length) return;
      const cur = vocabList[vIdx];
      document.getElementById('vocabProgress').innerText = `第 ${vIdx + 1} / ${vocabList.length} 個`;
      document.getElementById('vocabStars').innerText = '★'.repeat(cur.mastery || 0) + '☆'.repeat(5 - (cur.mastery || 0));
      document.getElementById('vPos').innerText = cur.partOfSpeech || 'word';
      document.getElementById('vWord').innerText = cur.word;
      document.getElementById('vPhonetic').innerText = cur.phonetic || '';
      document.getElementById('vTrans').innerText = cur.translation || '';
      document.getElementById('vEx').innerText = cur.example || '';
      document.getElementById('vBack').classList.toggle('hidden', !vFlipped);
    }

    function flipCard() { vFlipped = !vFlipped; renderVocab(); }
    function speakCurrentWord() { if (vocabList[vIdx]) speak(vocabList[vIdx].word); }
    function rateWord(delta) {
      if (!vocabList[vIdx]) return;
      vocabList[vIdx].mastery = Math.max(0, Math.min(5, (vocabList[vIdx].mastery || 0) + delta));
      saveStorage();
      vFlipped = false;
      vIdx = (vIdx + 1) % vocabList.length;
      renderVocab();
    }

    function initScramble() {
      if (!sentenceList.length) return;
      const cur = sentenceList[sIdx];
      document.getElementById('sCount').innerText = `第 ${sIdx + 1} / ${sentenceList.length} 題`;
      document.getElementById('sTrans').innerText = cur.translation;
      const words = cur.words || cur.sentence.split(' ');
      sPoolArr = words.map((w, i) => ({ id: i, text: w })).sort(() => Math.random() - 0.5);
      sSelArr = [];
      renderScrambleUI();
    }

    function renderScrambleUI() {
      document.getElementById('sSelected').innerHTML = sSelArr.map((t, i) => `<button onclick="unselectToken(${i})" class="px-3 py-1.5 rounded-xl bg-indigo-600 text-white text-sm font-bold">${t.text}</button>`).join('');
      document.getElementById('sPool').innerHTML = sPoolArr.map((t, i) => `<button onclick="selectToken(${i})" class="px-3 py-1.5 rounded-xl bg-slate-700 text-slate-100 text-sm">${t.text}</button>`).join('');
    }

    function selectToken(i) { sSelArr.push(sPoolArr.splice(i, 1)[0]); renderScrambleUI(); }
    function unselectToken(i) { sPoolArr.push(sSelArr.splice(i, 1)[0]); renderScrambleUI(); }
    function checkScramble() {
      const cur = sentenceList[sIdx];
      const ans = sSelArr.map(t => t.text).join(' ').replace(/[.,!?]/g, '').toLowerCase().trim();
      const target = cur.sentence.replace(/[.,!?]/g, '').toLowerCase().trim();
      if (ans === target) {
        speak(cur.sentence);
        alert('🎉 拼句完全正確！');
      } else {
        alert('順序還差一點點，再試一次！');
      }
    }
    function nextSentence() { sIdx = (sIdx + 1) % sentenceList.length; initScramble(); }

    function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
    function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }
    function saveNewItem(type) {
      const w = document.getElementById('newWordInput').value.trim();
      const t = document.getElementById('newTransInput').value.trim() || '自訂收錄';
      const ex = document.getElementById('newExInput').value.trim();
      if (!w) return;
      if (type === 'vocab') {
        vocabList.unshift({ id: 'v_' + Date.now(), word: w, translation: t, example: ex || w, mastery: 0 });
      } else {
        sentenceList.unshift({ id: 's_' + Date.now(), sentence: w, translation: t, words: w.split(' ') });
      }
      saveStorage();
      document.getElementById('newWordInput').value = '';
      document.getElementById('newTransInput').value = '';
      document.getElementById('newExInput').value = '';
      closeAddModal();
      renderVocab();
    }

    window.onload = () => { renderChat(); renderVocab(); initScramble(); };
  </script>
</body>
</html>
